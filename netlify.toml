[build]
  command = "npm run netlify-build"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Assurance Regent imports server.js outside the functions folder. Keep every
  # runtime npm package as an external module so Netlify copies the package into
  # the deployed function artifact instead of leaving a bare import behind.
  external_node_modules = [
    "dotenv",
    "serverless-http",
    "@netlify/aws-lambda-compat",
    "express",
    "helmet",
    "@supabase/supabase-js",
    "@openai/agents",
    "zod"
  ]
  included_files = ["data/**/*.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
