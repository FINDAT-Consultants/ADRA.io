[build]
  command = "npm run build && node scripts/apply-dashboard-holiday-descriptions-v6-3-116.mjs && node scripts/apply-onboarding-completion-transfer-v6-3-118.mjs && node scripts/apply-system-runtime-stability-v6-3-119.mjs && node scripts/apply-global-country-flags-holidays-v6-3-120.mjs && node scripts/apply-all-country-selector-flags-v6-3-121.mjs && node scripts/apply-country-flag-select-v6-3-122.mjs"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; script-src-attr 'none'; img-src 'self' data: blob: https://flagcdn.com https://fubqwljypdiojpbdunjc.supabase.co; connect-src 'self' https://fubqwljypdiojpbdunjc.supabase.co https://nominatim.openstreetmap.org; media-src 'self' blob: data: https://fubqwljypdiojpbdunjc.supabase.co; frame-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self' blob:; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"
    X-Download-Options = "noopen"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(self), payment=(), usb=(), serial=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Origin-Agent-Cluster = "?1"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, noarchive, nosnippet"
    Cache-Control = "no-store"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/careers.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Permissions-Policy = "microphone=(), camera=(), geolocation=(), payment=(), usb=(), serial=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/interview.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Permissions-Policy = "microphone=(), camera=(), geolocation=(), payment=(), usb=(), serial=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/careers"
  to = "/careers.html"
  status = 200

[[redirects]]
  from = "/interview"
  to = "/interview.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
