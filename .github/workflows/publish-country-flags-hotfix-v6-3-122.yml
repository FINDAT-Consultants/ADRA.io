name: Publish country flag UI hotfix v6.3.122

on:
  push:
    branches:
      - main
    paths:
      - 'country-flag-select-v6-3-122.js'
      - 'country-flag-select-v6-3-122.css'
      - 'scripts/publish-country-flag-select-v6-3-122.mjs'
      - '.github/workflows/publish-country-flags-hotfix-v6-3-122.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assurance-regent-country-flags-v6-3-122
  cancel-in-progress: true

jobs:
  publish-country-flags:
    if: ${{ !contains(github.event.head_commit.message || '', '[country-flags-artifact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch the committed Netlify artifact directly
        run: node scripts/publish-country-flag-select-v6-3-122.mjs

      - name: Verify published asset binding
        shell: bash
        run: |
          set -euo pipefail
          node --check public/country-flag-select-v6-3-122.js
          grep -q 'country-flag-select-v6-3-122.js' public/index.html
          grep -q 'country-flag-select-v6-3-122.css' public/index.html
          grep -q 'imageBacked:true' public/country-flag-select-v6-3-122.js
          grep -q 'https://flagcdn.com/w40/' public/country-flag-select-v6-3-122.js

      - name: Commit deployable public artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html public/index.html public/country-flag-select-v6-3-122.js public/country-flag-select-v6-3-122.css
          if git diff --cached --quiet; then
            echo 'Country flag public artifact is already current.'
            exit 0
          fi
          git commit -m 'Publish country flag UI v6.3.122 [country-flags-artifact] [skip ci]'
          git push origin HEAD:main
