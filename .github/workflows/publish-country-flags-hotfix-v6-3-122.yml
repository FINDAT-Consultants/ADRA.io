name: Publish country selector UI hotfix v6.3.123

on:
  push:
    branches:
      - main
    paths:
      - 'country-select-v6-3-123.js'
      - 'country-select-v6-3-123.css'
      - 'scripts/publish-country-select-v6-3-123.mjs'
      - '.github/workflows/publish-country-flags-hotfix-v6-3-122.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assurance-regent-country-selector-v6-3-123
  cancel-in-progress: true

jobs:
  publish-country-selector:
    if: ${{ !contains(github.event.head_commit.message || '', '[country-selector-artifact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch the committed Netlify artifact directly
        run: node scripts/publish-country-select-v6-3-123.mjs

      - name: Verify published country selector
        shell: bash
        run: |
          set -euo pipefail
          node --check public/country-select-v6-3-123.js
          grep -q 'country-select-v6-3-123.js' public/index.html
          grep -q 'country-select-v6-3-123.css' public/index.html
          grep -q 'selectedFlagVisible: true' public/country-select-v6-3-123.js
          grep -q 'everyOptionFlagVisible: true' public/country-select-v6-3-123.js
          grep -q 'compactReferenceStyle: true' public/country-select-v6-3-123.js
          grep -q 'settingsCurrencyCountry' public/country-select-v6-3-123.js
          grep -q 'data-company-registered-country' public/country-select-v6-3-123.js
          grep -q 'https://flagcdn.com/w40/' public/country-select-v6-3-123.js
          if grep -q 'country-flag-select-v6-3-122' public/index.html; then
            echo 'Old v6.3.122 selector is still bound in public/index.html.'
            exit 1
          fi

      - name: Commit deployable public artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html public/index.html public/country-select-v6-3-123.js public/country-select-v6-3-123.css
          if git diff --cached --quiet; then
            echo 'Country selector public artifact is already current.'
            exit 0
          fi
          git commit -m 'Publish country selector UI v6.3.123 [country-selector-artifact] [skip ci]'
          git push origin HEAD:main

# Explicit trigger after the v6.3.123 workflow was already present on main.
