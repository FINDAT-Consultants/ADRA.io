name: Publish deterministic runtime assets

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assurance-regent-runtime-publish
  cancel-in-progress: true

jobs:
  publish-runtime:
    if: ${{ !contains(github.event.head_commit.message || '', '[runtime-artifacts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish only deterministic deployment assets
        run: |
          node scripts/publish-auth-entry-bootstrap.mjs
          node scripts/refresh-public-app-integrity.mjs

      - name: Verify runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-auth-entry-resilience.mjs
          test -s public/auth-entry-bootstrap.js
          test -s public/auth-entry.css
          grep -q "fixed-layer" public/auth-entry-bootstrap.js
          grep -q "controlSignInId" public/auth-entry-bootstrap.js
          grep -q "auth-entry.css" public/index.html
          grep -q "auth-entry-bootstrap.js" public/index.html
          grep -q "SYSTEM_RUNTIME_STABILITY_SCHEMA119" app.js
          grep -q "ONBOARDING_COMPLETION_TRANSFER_SCHEMA118" app.js
          grep -q "GLOBAL_COUNTRY_HOLIDAY_SCHEMA120" app.js
          grep -q "ALL_COUNTRY_SELECTOR_FLAGS_SCHEMA121" app.js
          test -s public/country-select-v6-3-124.js
          test -s public/country-select-v6-3-124.css
          test -s public/interface-stability-v6-3-125.js
          test -s public/interface-stability-v6-3-125.css
          test -s public/work-analytics-layout-v6-3-126.js
          test -s public/work-analytics-layout-v6-3-126.css
          echo "[publish-verify] OK: deterministic auth assets and existing canonical runtime are intact."

      - name: Browser smoke test real production authentication DOM
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory public >/tmp/ar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "No Chrome/Chromium binary is available on this runner."; exit 1; fi
          timeout 90s "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --blink-settings=imagesEnabled=false \
            --host-resolver-rules="MAP fubqwljypdiojpbdunjc.supabase.co 127.0.0.1, MAP flagcdn.com 127.0.0.1, MAP flagsapi.com 127.0.0.1" \
            --virtual-time-budget=6500 \
            --dump-dom \
            'http://127.0.0.1:4173/?auth-smoke=1' \
            > /tmp/ar-auth-dom.html 2> /tmp/ar-auth-chrome.log
          grep -q 'data-auth-smoke="pass"' /tmp/ar-auth-dom.html
          grep -q 'data-auth-smoke-hit-targets="true"' /tmp/ar-auth-dom.html
          grep -q 'data-auth-smoke-signup="true"' /tmp/ar-auth-dom.html
          grep -q 'data-auth-smoke-back="true"' /tmp/ar-auth-dom.html
          echo "[auth-browser] OK: real production authentication controls are hit-testable and Sign up / Back switching works."

      - name: Commit deterministic runtime assets when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/auth-entry-bootstrap.js public/auth-entry.css public/index.html
          if git diff --cached --quiet; then
            echo "Deterministic runtime assets already match v6.3.127."
            exit 0
          fi
          git commit -m "Publish deterministic authentication runtime v6.3.127 [runtime-artifacts] [skip ci]"
          git push origin HEAD:main
