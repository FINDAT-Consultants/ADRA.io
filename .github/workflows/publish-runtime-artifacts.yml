name: Publish deterministic runtime assets

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assurance-regent-runtime-publish
  cancel-in-progress: true

jobs:
  publish-runtime:
    if: ${{ !contains(github.event.head_commit.message || '', '[runtime-artifacts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize proven duplicate runtime fragments
        run: |
          node scripts/normalize-runtime-v6-3-127.mjs
          node scripts/verify-runtime-normalization-v6-3-127.mjs

      - name: Publish deterministic deployment assets
        run: |
          node scripts/publish-auth-entry-bootstrap.mjs
          node scripts/publish-supabase-live-bridge-v6-3-129.mjs
          node scripts/refresh-public-app-integrity.mjs

      - name: Verify runtime contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-runtime-normalization-v6-3-127.mjs
          node scripts/verify-auth-entry-resilience.mjs
          test -s public/auth-entry-bootstrap.js
          test -s public/auth-entry.css
          test -s public/supabase-live-dashboard-v6-3-129.js
          grep -q "fixed-layer" public/auth-entry-bootstrap.js
          grep -q "installGlobalDialogGate" public/auth-entry-bootstrap.js
          ! grep -q "new MutationObserver" public/auth-entry-bootstrap.js
          grep -q "controlSignInId" public/auth-entry-bootstrap.js
          grep -q "auth-entry.css" public/index.html
          grep -q "auth-entry-bootstrap.js" public/index.html
          grep -q "supabase-live-dashboard-v6-3-129.js" public/index.html
          grep -q "application/x-assurance-regent-runtime" public/index.html
          grep -q "assurance_regent_browser_read_state" public/supabase-live-dashboard-v6-3-129.js
          grep -q "assurance_regent_browser_session_status" public/supabase-live-dashboard-v6-3-129.js
          grep -q "dashEmployeeCount" public/supabase-live-dashboard-v6-3-129.js
          grep -q "dashboardKpis" public/supabase-live-dashboard-v6-3-129.js
          grep -q "dashRecentPeople" public/supabase-live-dashboard-v6-3-129.js
          grep -q "SYSTEM_RUNTIME_STABILITY_SCHEMA119" app.js
          grep -q "ONBOARDING_COMPLETION_TRANSFER_SCHEMA118" app.js
          grep -q "GLOBAL_COUNTRY_HOLIDAY_SCHEMA120" app.js
          grep -q "ALL_COUNTRY_SELECTOR_FLAGS_SCHEMA121" app.js
          test -s public/country-select-v6-3-124.js
          test -s public/country-select-v6-3-124.css
          test -s public/interface-stability-v6-3-125.js
          test -s public/interface-stability-v6-3-125.css
          test -s public/work-analytics-layout-v6-3-126.js
          test -s public/work-analytics-layout-v6-3-126.css
          echo "[publish-verify] OK: normalized runtime, authentication, and Supabase live dashboard bridge are intact."

      - name: Browser smoke test exact production authentication markup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-auth-production-smoke-v6-3-127.mjs
          : > /tmp/ar-http.log
          python3 -m http.server 4173 --directory public >>/tmp/ar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/auth-entry-production-smoke.html >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "No Chrome/Chromium binary is available on this runner."; exit 1; fi
          timeout 20s "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --virtual-time-budget=2500 \
            --window-size=1440,1000 \
            --screenshot=/tmp/ar-auth-smoke.png \
            'http://127.0.0.1:4173/auth-entry-production-smoke.html?auth-smoke=1' \
            >/tmp/ar-auth-chrome.log 2>&1
          test -s /tmp/ar-auth-smoke.png
          sleep 0.25
          if ! grep -q '/__auth_smoke_pass' /tmp/ar-http.log; then
            echo "Authentication browser smoke did not report PASS."
            cat /tmp/ar-http.log
            cat /tmp/ar-auth-chrome.log
            exit 1
          fi
          if grep -q '/__auth_smoke_fail' /tmp/ar-http.log; then
            echo "Authentication browser smoke reported FAIL."
            cat /tmp/ar-http.log
            exit 1
          fi
          echo "[auth-browser] OK: exact production auth markup is hit-testable and Sign up / Back switching works."

      - name: Commit deterministic runtime assets on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A separate legacy asset workflow can advance main while this job is
          # testing. Always regenerate on the latest remote head so an old
          # artifact can never win the final push race.
          git fetch origin main
          REMOTE_MAIN="$(git rev-parse origin/main)"
          if [ "$(git rev-parse HEAD)" != "$REMOTE_MAIN" ]; then
            echo "main advanced during verification; regenerating on $REMOTE_MAIN"
            git reset --hard "$REMOTE_MAIN"
            node scripts/normalize-runtime-v6-3-127.mjs
            node scripts/verify-runtime-normalization-v6-3-127.mjs
            node scripts/publish-auth-entry-bootstrap.mjs
            node scripts/publish-supabase-live-bridge-v6-3-129.mjs
            node scripts/refresh-public-app-integrity.mjs
            node scripts/verify-auth-entry-resilience.mjs
          fi

          git add -- app.js public/app*.js public/auth-entry-bootstrap.js public/auth-entry.css public/supabase-live-dashboard-v6-3-129.js public/index.html
          if git diff --cached --quiet; then
            echo "Runtime already matches deterministic v6.3.129."
            exit 0
          fi
          git commit -m "Publish authentication and Supabase live dashboard v6.3.129 [runtime-artifacts] [skip ci]"
          git push origin HEAD:main
