name: Publish hardened runtime artifacts

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assurance-regent-runtime-publish
  cancel-in-progress: true

jobs:
  publish-runtime:
    if: ${{ !contains(github.event.head_commit.message || '', '[runtime-artifacts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned build dependency
        run: npm install --no-audit --no-fund

      - name: Build canonical hardened runtime
        run: npm run build && node scripts/apply-dashboard-holiday-descriptions-v6-3-116.mjs && node scripts/apply-onboarding-completion-transfer-v6-3-118.mjs && node scripts/apply-system-runtime-stability-v6-3-119.mjs && node scripts/apply-global-country-flags-holidays-v6-3-120.mjs && node scripts/apply-all-country-selector-flags-v6-3-121.mjs && node scripts/apply-country-flag-select-v6-3-122.mjs

      - name: Verify generated static runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-global-country-flags-holidays-v6-3-120.mjs
          node scripts/verify-all-country-selector-flags-v6-3-121.mjs
          node scripts/verify-country-flag-select-v6-3-122.mjs
          grep -q "SYSTEM_RUNTIME_STABILITY_SCHEMA119" app.js
          grep -q "ONBOARDING_COMPLETION_TRANSFER_SCHEMA118" app.js
          grep -q "GLOBAL_COUNTRY_HOLIDAY_SCHEMA120" app.js
          grep -q "ALL_COUNTRY_SELECTOR_FLAGS_SCHEMA121" app.js
          test -f public/country-flag-select-v6-3-122.js
          test -f public/country-flag-select-v6-3-122.css
          grep -q "imageBacked:true" public/country-flag-select-v6-3-122.js
          grep -q "country-flag-select-v6-3-122.js" public/index.html
          grep -q "country-flag-select-v6-3-122.css" public/index.html

      - name: Commit runtime artifacts when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app.js index.html public
          if git diff --cached --quiet; then
            echo "Runtime artifacts already match the canonical v6.3.122 build."
            exit 0
          fi
          git commit -m "Build hardened runtime artifacts v6.3.122 [runtime-artifacts] [skip ci]"
          git push origin HEAD:main
