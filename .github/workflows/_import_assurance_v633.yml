name: Import Assurance Regent v6.3.133

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_import_assurance_v633.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact v6.3.133 ZIP tree
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_COMMIT: b1b09f602fd31f9efd92b273abf1658edd8bff95
          EXPECTED_TREE: 853d5b266d61d66a92499983cfe7b74615b047a7
        shell: bash
        run: |
          set -euo pipefail
          IMPORT_PARENT="$GITHUB_SHA"

          cat .import/patch-*.b64 | base64 --decode > /tmp/missing.patch.xz
          cp .import/valid_manifest.tsv /tmp/valid_manifest.tsv
          cp .import/delete_manifest.txt /tmp/delete_manifest.txt
          test "$(sha256sum /tmp/missing.patch.xz | awk '{print $1}')" = "4984d7fa245352af53e47b4bbc3571f5336999852b5a38f5eb0e2c7c8c359169"
          xz -dc /tmp/missing.patch.xz > /tmp/missing.patch

          git cat-file -e "${BASELINE_COMMIT}^{commit}" 2>/dev/null || git fetch origin "$BASELINE_COMMIT"
          git checkout --detach --force "$BASELINE_COMMIT"
          git clean -ffd

          git apply --check /tmp/missing.patch
          git apply --whitespace=nowarn /tmp/missing.patch

          while IFS=$'\t' read -r sha path; do
            [ -n "$sha" ] || continue
            mkdir -p "$(dirname "$path")"
            api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" | jq -r '.content' | tr -d '\n' | base64 --decode > "$path"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$sha" ]; then
              echo "Blob verification failed for $path: expected $sha, got $actual" >&2
              exit 1
            fi
          done < /tmp/valid_manifest.tsv

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            rm -rf -- "$path"
          done < /tmp/delete_manifest.txt

          git add -A
          FINAL_TREE="$(git write-tree)"
          FILE_COUNT="$(git ls-files | wc -l | tr -d ' ')"
          echo "Final tree: $FINAL_TREE"
          echo "Tracked files: $FILE_COUNT"
          test "$FINAL_TREE" = "$EXPECTED_TREE"
          test "$FILE_COUNT" = "595"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FINAL_COMMIT="$(printf '%s\n' 'Import Assurance Regent v6.3.133 exact ZIP snapshot' | git commit-tree "$FINAL_TREE" -p "$IMPORT_PARENT")"
          echo "Final commit: $FINAL_COMMIT"

          git push origin "$FINAL_COMMIT:refs/heads/main"
          git push origin --delete _tmp-import-probe _tmp-import-blob-holder || true
