name: Import v6.3.19
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and import v6.3.19
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .import/part00 \
            .import/part01 \
            .import/part02 \
            .import/part03 \
            .import/part04 \
            .import/part05 \
            .import/part06_07 \
            .import/part08_09 \
            .import/fix10_0 \
            .import/fix10_1 \
            .import/fix10_2 \
            .import/fix10_3 \
            .import/part12_13 \
            .import/fix14_0 \
            .import/fix14_1 \
            .import/fix14_2 \
            .import/fix14_3 \
            .import/part16_17 \
            .import/part18_19 \
            .import/fix20_0 \
            .import/fix20_1 \
            .import/fix20_2 \
            .import/fix20_3 \
            .import/part22_23 \
            .import/part24_25 \
            .import/part26_27 \
            .import/part28_29 \
            .import/part30_31 \
            .import/part32 > /tmp/v6319.b64
          base64 -d /tmp/v6319.b64 > /tmp/v6319.tar.xz
          echo "bafee9fea7d271a3a91f09c86cf937c2a069377849a4ea9dda75b4c089e77f52  /tmp/v6319.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v6319.tar.xz -C .
          rm -rf .import
          rm -f .github/workflows/import-v6319.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          TREE_SHA="$(git write-tree)"
          test "$TREE_SHA" = "0d0c65f8d078dd5b3c74676f6b59552df4767f57"
          git commit -m "Import assurance_full_persistence_v6319"
          git push origin HEAD:main
