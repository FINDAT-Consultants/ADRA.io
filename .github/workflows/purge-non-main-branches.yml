name: Purge non-main branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          failed=0
          branches="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')"

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue

            echo "Deleting branch: $branch"
            if ! gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"; then
              echo "Failed to delete: $branch" >&2
              failed=1
            fi
          done <<< "$branches"

          exit "$failed"
