name: Protected client runtime check

on:
  push:
    branches:
      - main
      - hotfix/auth-runtime-clean-v6-3-127
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protected-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize proven duplicate runtime fragments
        run: |
          node scripts/normalize-runtime-v6-3-127.mjs
          node scripts/verify-runtime-normalization-v6-3-127.mjs

      - name: Publish deterministic authentication layer
        run: |
          node scripts/publish-auth-entry-bootstrap.mjs
          node scripts/refresh-public-app-integrity.mjs

      - name: Verify runtime contract without legacy mutation replay
        shell: bash
        run: |
          set -euo pipefail
          test -s app.js
          test -s index.html
          test -s public/index.html
          test -s public/auth-entry-bootstrap.js
          test -s public/auth-entry.css
          grep -q "controlSignInId" public/auth-entry-bootstrap.js
          grep -q "fixed-layer" public/auth-entry-bootstrap.js
          grep -q "auth-smoke" public/auth-entry-bootstrap.js
          grep -q "auth-entry.css" public/index.html
          grep -q "auth-entry-bootstrap.js" public/index.html
          grep -q "SYSTEM_RUNTIME_STABILITY_SCHEMA119" app.js
          grep -q "ONBOARDING_COMPLETION_TRANSFER_SCHEMA118" app.js
          grep -q "GLOBAL_COUNTRY_HOLIDAY_SCHEMA120" app.js
          grep -q "ALL_COUNTRY_SELECTOR_FLAGS_SCHEMA121" app.js
          test -s public/country-select-v6-3-124.js
          test -s public/country-select-v6-3-124.css
          test -s public/interface-stability-v6-3-125.js
          test -s public/interface-stability-v6-3-125.css
          test -s public/work-analytics-layout-v6-3-126.js
          test -s public/work-analytics-layout-v6-3-126.css
          grep -q "providerFailover:true" public/country-select-v6-3-124.js
          grep -q "rendererCssDriftFixes:true" public/interface-stability-v6-3-125.js
          grep -q "employeeMonthSeparated:true" public/work-analytics-layout-v6-3-126.js
          grep -q "jobsRowsSeparated:true" public/work-analytics-layout-v6-3-126.js
          node scripts/verify-runtime-normalization-v6-3-127.mjs
          node scripts/verify-auth-entry-resilience.mjs
          echo "[runtime-check] OK: normalized runtime and deterministic authentication contract verified."

      - name: Browser smoke test exact production authentication markup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-auth-production-smoke-v6-3-127.mjs
          python3 -m http.server 4173 --directory public >/tmp/ar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/auth-entry-production-smoke.html >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "No Chrome/Chromium binary is available on this runner."; exit 1; fi
          timeout 20s "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --blink-settings=imagesEnabled=false \
            --virtual-time-budget=2200 \
            --dump-dom \
            'http://127.0.0.1:4173/auth-entry-production-smoke.html?auth-smoke=1' \
            > /tmp/ar-auth-dom.html 2> /tmp/ar-auth-chrome.log
          grep -q 'data-auth-smoke="pass"' /tmp/ar-auth-dom.html
          grep -q 'data-auth-smoke-hit-targets="true"' /tmp/ar-auth-dom.html
          grep -q 'data-auth-smoke-signup="true"' /tmp/ar-auth-dom.html
          grep -q 'data-auth-smoke-back="true"' /tmp/ar-auth-dom.html
          grep -q 'data-smoke-blocker-open="false"' /tmp/ar-auth-dom.html
          grep -q 'id="controlSignInRole"' /tmp/ar-auth-dom.html
          grep -q 'id="controlSignInId"' /tmp/ar-auth-dom.html
          grep -q 'id="controlSignInPassword"' /tmp/ar-auth-dom.html
          grep -q 'id="openRegisterUser"' /tmp/ar-auth-dom.html
          grep -q 'id="backToSignIn"' /tmp/ar-auth-dom.html
          echo "[auth-browser] OK: exact production auth markup is hit-testable, the competing dialog is removed, and Sign up / Back switching works."

      - name: Browser layout smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory . >/tmp/ar-interface-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/scripts/interface-stability-v6-3-125-smoke.html >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4174/scripts/interface-stability-v6-3-125-smoke.html > /tmp/ar-interface-dom.html 2>/tmp/ar-interface-chrome.log
          grep -q 'data-smoke="pass"' /tmp/ar-interface-dom.html
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4174/scripts/work-analytics-layout-v6-3-126-smoke.html > /tmp/ar-work-analytics-dom.html 2>/tmp/ar-work-analytics-chrome.log
          grep -q 'data-smoke="pass"' /tmp/ar-work-analytics-dom.html
          grep -q 'data-work-analytics-layout="6.3.126"' /tmp/ar-work-analytics-dom.html
          echo "[layout-smoke] OK: interface stability and Work Analytics layout tests pass."
