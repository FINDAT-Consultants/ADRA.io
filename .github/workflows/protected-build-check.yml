name: Protected client build check

on:
  push:
    branches:
      - main
      - security/client-code-hardening-v6319
      - hotfix/auth-gate-runtime-safe
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protected-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned build dependency
        run: npm install --no-audit --no-fund

      - name: Repair renderer structure and build protected client
        run: node scripts/apply-interface-structure-v6-3-125.mjs && npm run build && node scripts/apply-dashboard-holiday-descriptions-v6-3-116.mjs && node scripts/apply-onboarding-completion-transfer-v6-3-118.mjs && node scripts/apply-system-runtime-stability-v6-3-119.mjs && node scripts/apply-global-country-flags-holidays-v6-3-120.mjs && node scripts/apply-all-country-selector-flags-v6-3-121.mjs && node scripts/apply-country-flag-select-v6-3-122.mjs && node scripts/publish-country-select-v6-3-123.mjs && node scripts/publish-country-select-v6-3-124.mjs && node scripts/publish-interface-stability-v6-3-125.mjs && node scripts/publish-work-analytics-layout-v6-3-126.mjs && node scripts/refresh-public-app-integrity.mjs

      - name: Verify hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ONBOARDING_COMPLETION_TRANSFER_SCHEMA118" app.js
          grep -q "SYSTEM_RUNTIME_STABILITY_SCHEMA119" app.js
          grep -q "GLOBAL_COUNTRY_HOLIDAY_SCHEMA120" app.js
          grep -q "ALL_COUNTRY_SELECTOR_FLAGS_SCHEMA121" app.js
          grep -q "criticalStateWriteLane:true" app.js
          grep -q "yellowDotNames:true" app.js
          grep -q "interface-analytics-row125" app.js
          grep -q "winner-score125" app.js
          grep -q "interface-daily-card125" app.js
          test -f public/country-select-v6-3-124.js
          test -f public/country-select-v6-3-124.css
          test -f public/interface-stability-v6-3-125.js
          test -f public/interface-stability-v6-3-125.css
          test -f public/work-analytics-layout-v6-3-126.js
          test -f public/work-analytics-layout-v6-3-126.css
          grep -q "providerFailover:true" public/country-select-v6-3-124.js
          grep -q "rendererCssDriftFixes:true" public/interface-stability-v6-3-125.js
          grep -q "employeeMonthOverlapFix:true" public/interface-stability-v6-3-125.js
          grep -q "jobsAnalyticsRowFix:true" public/interface-stability-v6-3-125.js
          grep -q "employeeMonthSeparated:true" public/work-analytics-layout-v6-3-126.js
          grep -q "jobsRowsSeparated:true" public/work-analytics-layout-v6-3-126.js
          grep -q "inlineImportantLayout:true" public/work-analytics-layout-v6-3-126.js
          grep -q "country-select-v6-3-124.js" public/index.html
          grep -q "interface-stability-v6-3-125.js" public/index.html
          grep -q "interface-stability-v6-3-125.css" public/index.html
          grep -q "work-analytics-layout-v6-3-126.js" public/index.html
          grep -q "work-analytics-layout-v6-3-126.css" public/index.html
          grep -q "https://flagsapi.com" netlify.toml
          node scripts/verify-global-country-flags-holidays-v6-3-120.mjs
          node scripts/verify-all-country-selector-flags-v6-3-121.mjs
          node scripts/verify-interface-stability-v6-3-125.mjs
          node scripts/verify-auth-entry-resilience.mjs
          echo "[runtime-smoke] OK: country flags, interface stability and Work Analytics spacing v6.3.126 are present in the published artifact."

      - name: Browser smoke test authentication gate and flag selector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory public >/tmp/ar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "No Chrome/Chromium binary is available on this runner."; exit 1; fi
          timeout 90s "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --blink-settings=imagesEnabled=false --host-resolver-rules="MAP fubqwljypdiojpbdunjc.supabase.co 127.0.0.1, MAP flagcdn.com 127.0.0.1, MAP flagsapi.com 127.0.0.1" --virtual-time-budget=10000 --dump-dom http://127.0.0.1:4173/ > /tmp/ar-dom.html 2> /tmp/ar-chrome.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/ar-dom.html').read_text(errors='replace')
          sign_in = re.search(r'<dialog\b[^>]*\bid=["\']controlSignInDialog["\'][^>]*>', html, re.I)
          register = re.search(r'<dialog\b[^>]*\bid=["\']controlRegisterDialog["\'][^>]*>', html, re.I)
          signup_button = re.search(r'\bid=["\']openRegisterUser["\']', html, re.I)
          flag_wrapper = re.search(r'\bclass=["\'][^"\']*ar-country-select124', html, re.I)
          flag_trigger = re.search(r'\bclass=["\'][^"\']*ar-country-trigger124', html, re.I)
          interface_marker = re.search(r'\bdata-interface-stability=["\']6\.3\.125["\']', html, re.I)
          work_layout_marker = re.search(r'\bdata-work-analytics-layout=["\']6\.3\.126["\']', html, re.I)
          if not sign_in: raise SystemExit('Sign-in dialog is missing from the rendered protected page.')
          if not re.search(r'\bopen(?:\s*=\s*(?:["\'][^"\']*["\']))?', sign_in.group(0), re.I): raise SystemExit('Sign-in dialog exists but is not open after application boot.')
          if not register: raise SystemExit('Sign-up dialog is missing from the rendered protected page.')
          if not signup_button: raise SystemExit('Sign-up control is missing from the rendered protected page.')
          if not flag_wrapper or not flag_trigger: raise SystemExit('v6.3.124 image-backed country selector did not initialize in the browser DOM.')
          if not interface_marker: raise SystemExit('v6.3.125 interface stability runtime did not initialize in the browser DOM.')
          if not work_layout_marker: raise SystemExit('v6.3.126 Work Analytics spacing runtime did not initialize in the browser DOM.')
          print('[browser-smoke] OK: auth gate, country selector, interface stability and Work Analytics spacing runtime initialize.')
          PY

      - name: Browser layout smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory . >/tmp/ar-interface-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/scripts/interface-stability-v6-3-125-smoke.html >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4174/scripts/interface-stability-v6-3-125-smoke.html > /tmp/ar-interface-dom.html 2>/tmp/ar-interface-chrome.log
          grep -q 'data-smoke="pass"' /tmp/ar-interface-dom.html
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4174/scripts/work-analytics-layout-v6-3-126-smoke.html > /tmp/ar-work-analytics-dom.html 2>/tmp/ar-work-analytics-chrome.log
          grep -q 'data-smoke="pass"' /tmp/ar-work-analytics-dom.html
          grep -q 'data-work-analytics-layout="6.3.126"' /tmp/ar-work-analytics-dom.html
          echo "[layout-smoke] OK: employee identity/score/meta spacing and Jobs Analytics columns do not collapse."
