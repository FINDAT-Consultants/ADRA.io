name: Protected client runtime check

on:
  push:
    branches:
      - main
      - hotfix/auth-runtime-clean-v6-3-127
      - hotfix/auth-lightweight-boot-v6-3-128
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protected-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize proven duplicate runtime fragments
        run: |
          node scripts/normalize-runtime-v6-3-127.mjs
          node scripts/verify-runtime-normalization-v6-3-127.mjs

      - name: Publish lightweight authentication gateway and Supabase live bridge
        run: |
          node scripts/publish-auth-entry-bootstrap.mjs
          node scripts/publish-supabase-live-bridge-v6-3-129.mjs
          node scripts/refresh-public-app-integrity.mjs

      - name: Verify lightweight boot and live-data contract
        shell: bash
        run: |
          set -euo pipefail
          test -s app.js
          test -s index.html
          test -s public/index.html
          test -s public/auth-entry-bootstrap.js
          test -s public/auth-entry.css
          test -s public/supabase-live-dashboard-v6-3-129.js
          grep -q "6.3.128" public/auth-entry-bootstrap.js
          grep -q "assurance_regent_browser_login" public/auth-entry-bootstrap.js
          grep -q "assurance_regent_browser_session_status" public/auth-entry-bootstrap.js
          grep -q "application/x-assurance-regent-runtime" public/auth-entry-bootstrap.js
          grep -q "application/x-assurance-regent-runtime" public/index.html
          grep -q "auth-entry.css" public/index.html
          grep -q "auth-entry-bootstrap.js" public/index.html
          grep -q "supabase-live-dashboard-v6-3-129.js" public/index.html
          grep -q "assurance_regent_browser_session_status" public/supabase-live-dashboard-v6-3-129.js
          grep -q "assurance_regent_browser_read_state" public/supabase-live-dashboard-v6-3-129.js
          grep -q "dashEmployeeCount" public/supabase-live-dashboard-v6-3-129.js
          grep -q "dashboardKpis" public/supabase-live-dashboard-v6-3-129.js
          grep -q "dashActivePeople" public/supabase-live-dashboard-v6-3-129.js
          grep -q "dashRecentPeople" public/supabase-live-dashboard-v6-3-129.js
          grep -q "dashAttentionPeople" public/supabase-live-dashboard-v6-3-129.js
          grep -q "SYSTEM_RUNTIME_STABILITY_SCHEMA119" app.js
          grep -q "ONBOARDING_COMPLETION_TRANSFER_SCHEMA118" app.js
          grep -q "GLOBAL_COUNTRY_HOLIDAY_SCHEMA120" app.js
          grep -q "ALL_COUNTRY_SELECTOR_FLAGS_SCHEMA121" app.js
          test -s public/country-select-v6-3-124.js
          test -s public/country-select-v6-3-124.css
          test -s public/interface-stability-v6-3-125.js
          test -s public/interface-stability-v6-3-125.css
          test -s public/work-analytics-layout-v6-3-126.js
          test -s public/work-analytics-layout-v6-3-126.css
          grep -q "providerFailover:true" public/country-select-v6-3-124.js
          grep -q "rendererCssDriftFixes:true" public/interface-stability-v6-3-125.js
          grep -q "employeeMonthSeparated:true" public/work-analytics-layout-v6-3-126.js
          grep -q "jobsRowsSeparated:true" public/work-analytics-layout-v6-3-126.js
          node scripts/verify-runtime-normalization-v6-3-127.mjs
          node scripts/verify-auth-entry-resilience.mjs
          echo "[runtime-check] OK: authenticated runtime and company-scoped Supabase dashboard bridge are published."

      - name: Browser smoke test complete signed-out production page
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-auth-production-smoke-v6-3-127.mjs
          : > /tmp/ar-http.log
          python3 -m http.server 4173 --directory public >>/tmp/ar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/auth-entry-production-smoke.html >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "No Chrome/Chromium binary is available on this runner."; exit 1; fi
          timeout 20s "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --virtual-time-budget=2500 \
            --window-size=1440,1000 \
            --screenshot=/tmp/ar-auth-smoke.png \
            'http://127.0.0.1:4173/auth-entry-production-smoke.html?auth-smoke=1' \
            >/tmp/ar-auth-chrome.log 2>&1
          test -s /tmp/ar-auth-smoke.png
          sleep 0.25
          if ! grep -q '/__auth_smoke_pass' /tmp/ar-http.log; then
            echo "Authentication browser smoke did not report PASS."
            cat /tmp/ar-http.log
            cat /tmp/ar-auth-chrome.log
            exit 1
          fi
          if grep -q '/__auth_smoke_fail' /tmp/ar-http.log; then
            echo "Authentication browser smoke reported FAIL."
            cat /tmp/ar-http.log
            exit 1
          fi
          grep -q 'controlSignInRole' public/auth-entry-production-smoke.html
          grep -q 'controlSignInId' public/auth-entry-production-smoke.html
          grep -q 'controlSignInPassword' public/auth-entry-production-smoke.html
          grep -q 'openRegisterUser' public/auth-entry-production-smoke.html
          grep -q 'backToSignIn' public/auth-entry-production-smoke.html
          grep -q 'application/x-assurance-regent-runtime' public/auth-entry-production-smoke.html
          echo "[auth-browser] OK: full production page stays responsive, auth controls are hit-testable, and app.js remains dormant while signed out."

      - name: Browser layout smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --directory . >/tmp/ar-interface-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/scripts/interface-stability-v6-3-125-smoke.html >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4174/scripts/interface-stability-v6-3-125-smoke.html > /tmp/ar-interface-dom.html 2>/tmp/ar-interface-chrome.log
          grep -q 'data-smoke="pass"' /tmp/ar-interface-dom.html
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4174/scripts/work-analytics-layout-v6-3-126-smoke.html > /tmp/ar-work-analytics-dom.html 2>/tmp/ar-work-analytics-chrome.log
          grep -q 'data-smoke="pass"' /tmp/ar-work-analytics-dom.html
          grep -q 'data-work-analytics-layout="6.3.126"' /tmp/ar-work-analytics-dom.html
          echo "[layout-smoke] OK: interface stability and Work Analytics layout tests pass."
