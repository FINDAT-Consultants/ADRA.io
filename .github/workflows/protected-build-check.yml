name: Protected client build check

on:
  push:
    branches:
      - main
      - security/client-code-hardening-v6319
      - hotfix/auth-gate-runtime-safe
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  protected-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned build dependency
        run: npm install --no-audit --no-fund

      - name: Build and verify protected client
        run: npm run build && node scripts/apply-dashboard-holiday-descriptions-v6-3-116.mjs && node scripts/apply-onboarding-completion-transfer-v6-3-118.mjs && node scripts/apply-system-runtime-stability-v6-3-119.mjs && node scripts/apply-global-country-flags-holidays-v6-3-120.mjs && node scripts/apply-all-country-selector-flags-v6-3-121.mjs

      - name: Verify hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ONBOARDING_COMPLETION_TRANSFER_SCHEMA118" app.js
          grep -q "SYSTEM_RUNTIME_STABILITY_SCHEMA119" app.js
          grep -q "GLOBAL_COUNTRY_HOLIDAY_SCHEMA120" app.js
          grep -q "ALL_COUNTRY_SELECTOR_FLAGS_SCHEMA121" app.js
          grep -q "criticalStateWriteLane:true" app.js
          grep -q "allCountrySelectors:true" app.js
          grep -q "yellowDotNames:true" app.js
          grep -q "allCountryOptions:true" app.js
          grep -q "./app.js?v=6.3.121" index.html
          APP_FILE="$(find public -maxdepth 1 -type f -name 'app*.js' | head -n 1)"
          test -n "$APP_FILE"
          grep -q "ONBOARDING_COMPLETION_TRANSFER_SCHEMA118" "$APP_FILE"
          grep -q "SYSTEM_RUNTIME_STABILITY_SCHEMA119" "$APP_FILE"
          grep -q "GLOBAL_COUNTRY_HOLIDAY_SCHEMA120" "$APP_FILE"
          grep -q "ALL_COUNTRY_SELECTOR_FLAGS_SCHEMA121" "$APP_FILE"
          node scripts/verify-global-country-flags-holidays-v6-3-120.mjs
          node scripts/verify-all-country-selector-flags-v6-3-121.mjs
          echo "[runtime-smoke] OK: onboarding, persistence, named holidays, and flags across all country selectors are present."

      - name: Browser smoke test authentication gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory public >/tmp/ar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo "No Chrome/Chromium binary is available on this runner."; exit 1; fi
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --dump-dom http://127.0.0.1:4173/ > /tmp/ar-dom.html 2> /tmp/ar-chrome.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/ar-dom.html').read_text(errors='replace')
          sign_in = re.search(r'<dialog\b[^>]*\bid=["\']controlSignInDialog["\'][^>]*>', html, re.I)
          register = re.search(r'<dialog\b[^>]*\bid=["\']controlRegisterDialog["\'][^>]*>', html, re.I)
          signup_button = re.search(r'\bid=["\']openRegisterUser["\']', html, re.I)
          if not sign_in: raise SystemExit('Sign-in dialog is missing from the rendered protected page.')
          if not re.search(r'\bopen(?:\s*=\s*(?:["\'][^"\']*["\']))?', sign_in.group(0), re.I): raise SystemExit('Sign-in dialog exists but is not open after application boot.')
          if not register: raise SystemExit('Sign-up dialog is missing from the rendered protected page.')
          if not signup_button: raise SystemExit('Sign-up control is missing from the rendered protected page.')
          print('[browser-smoke] OK: sign-in dialog opens and sign-up entry is present.')
          PY
