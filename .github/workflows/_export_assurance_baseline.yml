name: Export Assurance baseline
on:
  push:
    paths:
      - '.github/workflows/_export_assurance_baseline.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v6.3.129 baseline
        uses: actions/checkout@v4
        with:
          ref: b1b09f602fd31f9efd92b273abf1658edd8bff95
          fetch-depth: 1
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload baseline tree
        uses: actions/upload-artifact@v4
        with:
          name: assurance-regent-v6-3-129-baseline
          path: .
          include-hidden-files: true
          retention-days: 1
          compression-level: 9
