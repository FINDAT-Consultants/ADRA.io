name: Publish interface stability v6.3.125

on:
  push:
    branches:
      - main
    paths:
      - 'interface-stability-v6-3-125.css'
      - 'interface-stability-v6-3-125.js'
      - 'scripts/publish-interface-stability-v6-3-125.mjs'
      - 'scripts/interface-stability-v6-3-125-smoke.html'
      - '.github/workflows/publish-interface-stability-v6-3-125.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assurance-regent-interface-stability-v6-3-125
  cancel-in-progress: true

jobs:
  publish-interface:
    if: ${{ !contains(github.event.head_commit.message || '', '[interface-artifact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate source runtime
        run: |
          node --check interface-stability-v6-3-125.js
          grep -q 'employeeMonthOverlapFix:true' interface-stability-v6-3-125.js
          grep -q 'jobsAnalyticsRowFix:true' interface-stability-v6-3-125.js
          grep -q '#mtsEmployeeMonth>.user-identity' interface-stability-v6-3-125.css
          grep -q '#mtsJobsList>div' interface-stability-v6-3-125.css
          grep -q '.daily-pair>article' interface-stability-v6-3-125.css

      - name: Patch deployable artifact
        run: node scripts/publish-interface-stability-v6-3-125.mjs

      - name: Browser layout smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/ar-interface-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/scripts/interface-stability-v6-3-125-smoke.html >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo 'No Chrome/Chromium binary available.'; exit 1; fi
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4173/scripts/interface-stability-v6-3-125-smoke.html > /tmp/ar-interface-dom.html 2>/tmp/ar-interface-chrome.log
          grep -q 'data-smoke="pass"' /tmp/ar-interface-dom.html || { cat /tmp/ar-interface-dom.html; exit 1; }
          grep -q 'data-interface-stability="6.3.125"' /tmp/ar-interface-dom.html
          echo '[interface-smoke] OK: employee card, analytics rows, daily cards and density rules pass in Chromium.'

      - name: Verify published bindings
        shell: bash
        run: |
          set -euo pipefail
          test -f public/interface-stability-v6-3-125.js
          test -f public/interface-stability-v6-3-125.css
          grep -q 'interface-stability-v6-3-125.js' public/index.html
          grep -q 'interface-stability-v6-3-125.css' public/index.html
          grep -q 'integrity="sha384-' public/index.html

      - name: Commit deployable interface artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html public/index.html public/interface-stability-v6-3-125.js public/interface-stability-v6-3-125.css
          if git diff --cached --quiet; then
            echo 'Interface artifact is already current.'
            exit 0
          fi
          git commit -m 'Publish interface stability v6.3.125 [interface-artifact] [skip ci]'
          git push origin HEAD:main
