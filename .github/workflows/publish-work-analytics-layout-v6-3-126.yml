name: Publish Work Analytics layout v6.3.126

on:
  push:
    branches:
      - main
    paths:
      - 'work-analytics-layout-v6-3-126.js'
      - 'work-analytics-layout-v6-3-126.css'
      - 'scripts/publish-work-analytics-layout-v6-3-126.mjs'
      - 'scripts/work-analytics-layout-v6-3-126-smoke.html'
      - '.github/workflows/publish-work-analytics-layout-v6-3-126.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assurance-regent-work-analytics-layout-v6-3-126
  cancel-in-progress: true

jobs:
  publish-layout:
    if: ${{ !contains(github.event.head_commit.message || '', '[work-analytics-artifact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate source runtime
        run: |
          node --check work-analytics-layout-v6-3-126.js
          grep -q "employeeMonthSeparated:true" work-analytics-layout-v6-3-126.js
          grep -q "jobsRowsSeparated:true" work-analytics-layout-v6-3-126.js
          grep -q "inlineImportantLayout:true" work-analytics-layout-v6-3-126.js
          grep -q "#mtsEmployeeMonth.mts-employee-month126" work-analytics-layout-v6-3-126.css
          grep -q "#mtsJobsList>.mts-job-row126" work-analytics-layout-v6-3-126.css

      - name: Patch deployable artifact
        run: node scripts/publish-work-analytics-layout-v6-3-126.mjs

      - name: Browser spacing smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/ar-work-analytics-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/scripts/work-analytics-layout-v6-3-126-smoke.html >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then echo 'No Chrome/Chromium binary available.'; exit 1; fi
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4173/scripts/work-analytics-layout-v6-3-126-smoke.html > /tmp/ar-work-analytics-dom.html 2>/tmp/ar-work-analytics-chrome.log
          grep -q 'data-smoke="pass"' /tmp/ar-work-analytics-dom.html || { cat /tmp/ar-work-analytics-dom.html; exit 1; }
          grep -q 'data-work-analytics-layout="6.3.126"' /tmp/ar-work-analytics-dom.html
          echo '[work-analytics-smoke] OK: employee identity, metric spacing and jobs grid are separated in Chromium.'

      - name: Verify published bindings
        shell: bash
        run: |
          set -euo pipefail
          test -f public/work-analytics-layout-v6-3-126.js
          test -f public/work-analytics-layout-v6-3-126.css
          grep -q 'work-analytics-layout-v6-3-126.js' public/index.html
          grep -q 'work-analytics-layout-v6-3-126.css' public/index.html
          grep -q 'integrity="sha384-' public/index.html

      - name: Commit deployable Work Analytics artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html public/index.html public/work-analytics-layout-v6-3-126.js public/work-analytics-layout-v6-3-126.css
          if git diff --cached --quiet; then
            echo 'Work Analytics artifact is already current.'
            exit 0
          fi
          git commit -m 'Publish Work Analytics layout v6.3.126 [work-analytics-artifact] [skip ci]'
          git push origin HEAD:main
