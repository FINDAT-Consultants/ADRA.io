<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Authentication interactivity smoke</title>
  <style>
    body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#eef4f7}
    .app-shell{min-height:100vh;background:#d8e6eb}
    dialog{border:0;border-radius:16px;padding:20px;width:min(440px,calc(100vw - 40px))}
    dialog::backdrop{background:rgba(5,25,35,.55)}
    form{display:grid;gap:12px}
    input,select,button{min-height:42px;padding:8px 10px}
    #competingDialog{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;opacity:.01;background:#000}
  </style>
</head>
<body class="auth-required" data-smoke="pending">
  <div class="app-shell" aria-hidden="true"></div>

  <dialog id="controlSignInDialog" class="modal control-signin-dialog auth-entry-dialog">
    <form id="controlSignInForm">
      <label>User type
        <select id="controlSignInRole"><option>Employee</option><option>Administrator</option></select>
      </label>
      <label>Username / Email / Employee ID
        <input id="controlSignInIdentifier" autocomplete="username" />
      </label>
      <label>Password
        <input id="controlSignInPassword" type="password" autocomplete="current-password" />
      </label>
      <button id="openRegisterUser" type="button">Sign up</button>
      <button id="controlSignInSubmit" type="button">Sign in</button>
    </form>
  </dialog>

  <dialog id="controlRegisterDialog" class="modal auth-entry-dialog">
    <form><input id="registerField" /></form>
  </dialog>

  <dialog id="competingDialog" aria-label="Synthetic blocking dialog"></dialog>

  <script src="../public/auth-entry-bootstrap.js"></script>
  <script>
    (() => {
      const blocker = document.getElementById('competingDialog');
      try { blocker.showModal(); } catch (_) { blocker.setAttribute('open', ''); }

      const controls = [
        document.getElementById('controlSignInRole'),
        document.getElementById('controlSignInIdentifier'),
        document.getElementById('controlSignInPassword'),
        document.getElementById('openRegisterUser'),
        document.getElementById('controlSignInSubmit'),
      ];

      const isHitTarget = (element) => {
        const rect = element.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        const hit = document.elementFromPoint(x, y);
        return hit === element || element.contains(hit);
      };

      setTimeout(() => {
        const signIn = document.getElementById('controlSignInDialog');
        const pass = signIn.open
          && !blocker.open
          && controls.every((control) => !control.hasAttribute('inert') && isHitTarget(control))
          && document.documentElement.dataset.authEntryInteractive === 'ready';
        document.body.dataset.smoke = pass ? 'pass' : 'fail';
        document.body.dataset.blockerOpen = String(blocker.open);
      }, 600);
    })();
  </script>
</body>
</html>
